<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"> 
	<head> 
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
		<title>map</title>
		<script type="text/javascript" src="http://apis.daum.net/maps/maps3.js?apikey=????"></script>
		</script>
		<script type="text/javascript">

			var map;
			var position = new daum.maps.LatLng(37.537123, 127.005923);
			window.onload = function(){
			map = new daum.maps.Map(document.getElementById("map"),{
					center: position,
					level: 4,
					mapTypeId: daum.maps.MapTypeId.HYBRID
				});


			marker = new daum.maps.Marker({
				position: position
			});
			marker.setMap(map);

			infoWindow = new daum.maps.InfoWindow({
				content : 'myHome!!'
			});
			infoWindow.open(map, marker);

			zoomControl = new daum.maps.ZoomControl();
			map.addControl(zoomControl, daum.maps.ControlPosition.RIGHT);
			mapTypeControl = new daum.maps.MapTypeControl();
			map.addControl(mapTypeControl, daum.maps.ControlPosition.TOPRIGHT);
		}
		</script>

	</head> 
		<style type="text/css">
			#map {width:800px; height:600px; border: 1px solid red;}
		</style>
	<body>
	<p>my map</p>
	<div id="map"/>
	</body> 

</html>
